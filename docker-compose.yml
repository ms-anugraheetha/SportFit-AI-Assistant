# LOCAL testing only: PostgreSQL + the app, built from the same Dockerfile used for the Hugging Face Space.
#   docker compose up --build        then open http://localhost:8000   (staff: /staff)
#   docker compose down              stop (data is kept)      docker compose down -v   stop and DELETE the data
#
# Secrets (HF_TOKEN, STAFF_PASSWORD_HASH, SESSION_SECRET) are read from backend/.env, which is never committed.
# The database below is a throwaway local one; its password is not a real secret and the port is not exposed
# to your network. For the public Space you use an EXTERNAL PostgreSQL instead (docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportfit
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-sportfit_local_only}
      POSTGRES_DB: sportfit
    volumes:
      - sportfit_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportfit -d sportfit"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      # These override anything in backend/.env so the container always talks to the compose database.
      DATABASE_URL: postgresql+psycopg://sportfit:${LOCAL_DB_PASSWORD:-sportfit_local_only}@db:5432/sportfit
      APP_ENV: development          # plain http://localhost cannot keep Secure cookies
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "127.0.0.1:8000:7860"

volumes:
  sportfit_pgdata:
